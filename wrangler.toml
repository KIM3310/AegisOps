name = "aegisops-ai-incident-doctor"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Production and preview use separate D1 databases. Credentials are encrypted Pages secrets.
[[d1_databases]]
binding = "RESPONSE_DB"
database_name = "aegisops-response-production"
database_id = "acdce70e-d00a-4ecc-8e21-061b1f389c81"
migrations_dir = "migrations"

[[env.preview.d1_databases]]
binding = "RESPONSE_DB"
database_name = "aegisops-response-preview"
database_id = "fd0261fe-08f2-4f86-a372-bf4fea630be3"
migrations_dir = "migrations"
